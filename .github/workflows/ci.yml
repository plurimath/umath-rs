name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.86.0
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt
      - name: Install Python for the native ABI check
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo +${{ matrix.rust }} fmt --all -- --check
      - name: Test the default raw parser surface
        run: cargo +${{ matrix.rust }} test --locked --all-targets
      - name: Test all features and targets
        run: cargo +${{ matrix.rust }} test --locked --all-features --all-targets
      - name: Test documentation with all features
        run: cargo +${{ matrix.rust }} test --locked --all-features --doc
      - name: Build the native ABI library
        run: cargo +${{ matrix.rust }} build --locked --all-features --lib
      - name: Exercise the native ABI and result ownership
        run: python .github/scripts/check-native-abi.py umath

      - name: Replay the complete frozen legacy raw corpus
        run: cargo +${{ matrix.rust }} test --locked --all-features --test full_legacy_corpus -- --ignored

      - name: Check out the pinned unicode generation 5 corpus
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: plurimath/plurimath-testsuite
          ref: acbdf0319dfb9bc49c1726bdbdedac276476e9b5
          path: .corpus
          persist-credentials: false
      - name: Verify and extract the pinned generation
        run: |
          python -m pip install PyYAML==6.0.2
          python .github/scripts/extract-corpus.py .corpus tests/fixtures/corpus-pin-5.json target/corpus-5.json
      - name: Replay pinned generation 5 (raw-tree and typed-model rows)
        env:
          UMATH_CORPUS_CASES: target/corpus-5.json
          UMATH_CORPUS_REPORT: target/corpus-5-report.json
        run: cargo +${{ matrix.rust }} test --locked --all-features --test corpus_replay -- --ignored
      - name: Upload the replay report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-5-report-${{ matrix.os }}-${{ matrix.rust }}
          path: target/corpus-5-report.json
          if-no-files-found: ignore

      - name: Check native depth guards and reuse on default caller stacks
        run: python .github/scripts/check-native-depth.py umath
